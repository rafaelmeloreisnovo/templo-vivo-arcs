name: Templo ARCS Owner Reviewer Matrix V11 (documentation only)
on:
  pull_request:
    paths:
      - "governance/ops/ownership_v1/**"
      - ".github/workflows/tvarcs-owner-review-v11.yml"
permissions:
  contents: read
jobs:
  owner-review-falsifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source identity and fail-closed register
        run: python3 governance/ops/ownership_v1/validate_register.py
      - name: Adversarial human assignment and false certification tests
        run: python3 -m unittest discover -s governance/ops/ownership_v1 -p 'test_validate_register.py' -v
      - name: No unexpected files or license/provider changes
        env:
          BASE_SHA: \${{ github.event.pull_request.base.sha }}
          HEAD_SHA: \${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os,sys,subprocess
          sys.path.insert(0,"governance/ops/ownership_v1")
          from validate_register import validate_diff
          paths=subprocess.check_output(["git","diff","--name-only",os.environ["BASE_SHA"],os.environ["HEAD_SHA"]],text=True).splitlines()
          validate_diff(paths)
          print("PASS_SCOPED_DIFF",len(paths))
          PY
